name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create --org com.stevenfoong --project-name kana_cards --platforms android .
          python3 tools/patch_android.py

      - name: Use the shared signing key
        env:
          KEYSTORE_B64: ${{ secrets.TEST_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TEST_KEYSTORE_B64 secret is not set, so this APK could not update the installed app."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kana.keystore"
          echo "KANA_KEYSTORE=$RUNNER_TEMP/kana.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/kana.keystore" -storepass android | grep -m1 "SHA256"

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk kana-cards.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk kana-cards-older-phones.apk

      - name: Record build details
        run: |
          {
            echo "Built from ${GITHUB_SHA::7}. On your phone, download kana-cards.apk and open it."
            echo "Use kana-cards-older-phones.apk only if the first one will not install."
            echo
            echo "### Build details"
            echo '```'
            flutter --version | head -1
            for p in shared_preferences shared_preferences_android flutter_tts audioplayers jni; do
              v=$(awk -v p="  $p:" '$0==p{f=1} f&&/version:/{print $2; exit}' pubspec.lock)
              echo "$p: ${v:-not used}"
            done
            grep -E "^shrink=" android/gradle.properties || echo "shrink: default"
            python3 -c "import json; d=json.load(open('assets/audio/index.json')); print('Voice clips:', len(set(d['clips'].values())), 'from', d.get('voice') or 'none (phone voice only)')"
            signer=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$signer" verify --print-certs kana-cards.apk | grep -m1 "SHA-256" | sed 's/^.*SHA-256 digest: /Signing key SHA-256: /' || echo "Signing key: could not read"
            if [ -d build/app/outputs/mapping/release ]; then echo "R8 mapping: present (shrinking ran)"; else echo "R8 mapping: none (shrinking off)"; fi
            echo '```'
          } > build-info.md
          cat build-info.md

      - uses: actions/upload-artifact@v4
        with:
          name: kana-cards-build-${{ github.run_number }}
          path: kana-cards*.apk

      - name: Publish to the "latest-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build kana-cards.apk kana-cards-older-phones.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build #${{ github.run_number }}" \
            --notes-file build-info.md
