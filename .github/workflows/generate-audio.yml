name: Generate audio

# Turns the word lists in content/*.csv into decks, makes the voice clips
# with VOICEVOX and commits both. It does not build an APK unless
# "Build APK afterwards" is ticked when running it by hand.
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/decks/**'
      - 'tools/build_word_decks.py'
      - 'tools/generate_audio.py'
      - '.github/workflows/generate-audio.yml'
  workflow_dispatch:
    inputs:
      voice:
        description: 'VOICEVOX character name'
        default: 'No.7'
      style:
        description: 'Voice style'
        default: 'ノーマル'
      build_apk:
        description: 'Build APK afterwards'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the voice engine
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:50021/version; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::VOICEVOX engine did not start"; exit 1

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Build word decks from content/*.csv
        run: python3 tools/build_word_decks.py

      - name: Generate clips
        env:
          VOICE_NAME: ${{ inputs.voice || 'No.7' }}
          VOICE_STYLE: ${{ inputs.style || 'ノーマル' }}
        run: |
          python3 tools/generate_audio.py | tee audio.log
          echo "::notice::$(tail -1 audio.log)"

      - name: Commit decks and clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/audio assets/decks
          if git diff --cached --quiet; then
            echo "::notice::Clips already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update decks and voice clips ($(tail -1 audio.log))"
          git pull -q --rebase origin main
          git push

      - name: Build APK afterwards
        if: ${{ inputs.build_apk }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
